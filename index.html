<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Portfolio Dashboard</title>
<link rel="icon" type="image/png" sizes="32x32" href="https://img1.pic.in.th/images/Untitled-designc160a471028e98fe.png">
<link rel="apple-touch-icon" href="https://img1.pic.in.th/images/pie-chart.png">
<style>
  :root{ --bg:#f5f7fb; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    height:100%;
    background:var(--bg);
    overflow:hidden; /* the iframe itself scrolls — the outer page shouldn't */
  }
  /* Full-bleed responsive frame. 100dvh (dynamic viewport height) avoids the
     "jumps when the mobile browser address bar hides/shows" problem; the
     100vh line is a fallback for older browsers that don't support dvh. */
  .frame-wrap{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    height:100dvh;
  }
  iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
  }
  /* simple loading state shown until the iframe fires onload */
  .loading{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:12px;
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:#6b7280;
    font-size:13px;
    transition:opacity .25s ease;
    z-index:5;
  }
  .loading.hide{ opacity:0; pointer-events:none; }
  .spinner{
    width:34px;height:34px;
    border:3px solid rgba(0,0,0,.08);
    border-top-color:#2563eb;
    border-radius:50%;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <div>กำลังโหลด Portfolio Dashboard...</div>
</div>

<div class="frame-wrap"> 
  <iframe
    id="dashFrame"
    src="https://script.google.com/macros/s/AKfycbwDfo5tLGXeTuLRRxHGQ1VQbmFXlZO1moLFnB61iHKkHQXQjZHoZDyDSRYkvNxANC9I/exec"
    title="Portfolio Dashboard"
    loading="eager"
    allow="clipboard-write"
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>
</div>

<script>
  var f = document.getElementById('dashFrame');
  var l = document.getElementById('loading');
  function hideLoading(){ l.classList.add('hide'); }
  f.addEventListener('load', hideLoading);
  // safety net in case the load event doesn't fire for some reason
  setTimeout(hideLoading, 8000);
</script>

</body>
</html>
