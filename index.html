<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Dashboard</title>
<style>
  html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:#0e1015}
  #frame{position:fixed;inset:0;width:100%;height:100%;border:none}
  #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0e1015;color:#9aa1ae;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;z-index:10;transition:opacity .3s}
  #loading.hide{opacity:0;pointer-events:none}
  .spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,.15);border-top-color:#3b82f6;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #fallback{margin-top:6px;font-size:12px}
  #fallback a{color:#3b82f6;text-decoration:none}
  #fallback a:hover{text-decoration:underline}
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div>กำลังโหลด Portfolio Dashboard...</div>
  <div id="fallback">โหลดนานเกินไป? <a href="https://script.google.com/macros/s/AKfycbwDfo5tLGXeTuLRRxHGQ1VQbmFXlZO1moLFnB61iHKkHQXQjZHoZDyDSRYkvNxANC9I/exec" target="_top">กดเปิดตรงนี้</a></div>
</div>

<iframe id="frame"
        src="https://script.google.com/macros/s/AKfycbwDfo5tLGXeTuLRRxHGQ1VQbmFXlZO1moLFnB61iHKkHQXQjZHoZDyDSRYkvNxANC9I/exec"
        title="Portfolio Dashboard"
        allow="clipboard-write"
        onload="document.getElementById('loading').classList.add('hide')"></iframe>

<script>
  // safety net: if the iframe never fires onload (some extensions block it silently),
  // stop showing the spinner after a few seconds and just leave the fallback link visible
  setTimeout(function(){
    var f = document.getElementById('fallback');
    if (f) f.style.fontWeight = '600';
  }, 6000);
</script>

</body>
</html>
